name: ci
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: Install liburing 2.8 (Ubuntu 24.04 ships an older version)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config
          git clone --depth 1 --branch liburing-2.8 https://github.com/axboe/liburing.git /tmp/liburing
          cd /tmp/liburing && ./configure --prefix=/usr/local && make -j"$(nproc)" && sudo make install
          sudo ldconfig

      - name: Build (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      # UringNet and PinnedThreads are excluded until those tests stop depending on
      # fixed ports, sleeps and core pinning.
      - name: Test
        run: ctest --test-dir build --output-on-failure -E "UringNet|PinnedThreads"

      - name: Build and test with ThreadSanitizer
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAETHER_TSAN=ON
          cmake --build build-tsan -j"$(nproc)"
          ctest --test-dir build-tsan --output-on-failure -E "UringNet|PinnedThreads"
